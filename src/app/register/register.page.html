<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="Back"></ion-back-button>
    </ion-buttons>
    <ion-title>Register</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row class="justify-content-center">
      <ion-col align-self-center size-md="6" size-lg="5" size-xs="12">
        <div class="ion-text-center">
          <h4>Register Form</h4>
        </div>

        <form class="form">
          <ion-item>
            <ion-icon slot="start" name="person-outline"></ion-icon>
            <ion-input placeholder="Enter username" type="text"></ion-input>
          </ion-item>

          <ion-item>
            <ion-icon slot="start" name="mail-outline"></ion-icon>
            <ion-input placeholder="Enter email" type="email"></ion-input>
          </ion-item>

          <ion-item>
            <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
            <ion-input placeholder="Enter password" type="password"></ion-input>
          </ion-item>

          <ion-item>
            <ion-icon slot="start" name="calendar-outline"></ion-icon>
            <ion-input placeholder="Enter date" type="date"></ion-input>
          </ion-item>

          <div class="ion-padding-top">
            <ion-radio-group>
              <ion-item>
                <ion-label>Homme</ion-label>
                <ion-radio slot="start" value="homme"></ion-radio>
              </ion-item>
              <ion-item>
                <ion-label>Femme</ion-label>
                <ion-radio slot="start" value="femme"></ion-radio>
              </ion-item>
            </ion-radio-group>
          </div>

          <div class="ion-padding-top">
            <ion-button expand="block" size="large" type="submit">
              Register
            </ion-button>
          </div>
        </form>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
