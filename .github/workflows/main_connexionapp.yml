name: Build and deploy Ionic app to Azure Web App - connexionapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Build Ionic project
        run: |
          npm install -g @ionic/cli
          ionic build --prod
        env:
          CI: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ionic-app
          path: www  # <-- le dossier à déployer

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ionic-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D7280A73182841E9BD6C7D86817531B3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_16027005BA764A538B53AD6B0EB3CB4D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1E6F1948D6374DA589FE227565F6056F }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'connexionapp'
          slot-name: 'Production'
          package: www  # <-- déploie seulement le build Ionic
